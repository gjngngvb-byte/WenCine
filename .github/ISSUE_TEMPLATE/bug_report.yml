name: Relatar um bug
description: Informe um problema reproduzível no WenCine.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir?
      description: Não inclua senhas, tokens ou dados pessoais.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador/dispositivo
    validations:
      required: true

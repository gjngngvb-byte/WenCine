services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wencine
      POSTGRES_USER: wencine
      POSTGRES_PASSWORD: wencine_local_only
    ports: ["5432:5432"]
    volumes: [wencine-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wencine -d wencine"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [wencine-redis:/data]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  wencine-postgres:
  wencine-redis:
